<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сімейний лікар - Скринінг здоров'я 40+</title>
  <link rel="icon" href="https://www.gstatic.com/images/branding/productlogos/sites_2026/v3/ico/sites_2026_16dp.ico">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Bitter:400,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: rgb(8, 86, 126);
      --text: rgb(33, 33, 33);
      --white: rgb(255, 255, 255);
      --border: rgb(240, 240, 240);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Bitter, Georgia, serif;
      font-size: 11pt;
      line-height: 1.6;
      color: var(--text);
      background: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--primary);
      color: var(--white);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 64px;
    }

    .site-title {
      font-family: Montserrat, sans-serif;
      font-size: 15pt;
      font-weight: 400;
      line-height: 1.33;
      color: var(--white);
    }

    .site-title:hover {
      opacity: 0.8;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--white);
      cursor: pointer;
      padding: 8px;
    }

    .nav-toggle svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .main-nav ul {
      display: flex;
      list-style: none;
      gap: 4px;
    }

    .main-nav a {
      display: block;
      font-family: Bitter, Georgia, serif;
      font-size: 12pt;
      line-height: 28px;
      color: var(--white);
      padding: 14px 10px 6px;
      border-bottom: 8px solid transparent;
      transition: opacity 0.15s;
    }

    .main-nav a:hover {
      opacity: 0.6;
    }

    /* Content */
    .content {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .content h1 {
      font-family: Montserrat, sans-serif;
      font-size: 34pt;
      font-weight: 700;
      line-height: 1.2;
      color: var(--primary);
      text-align: center;
      margin-bottom: 32px;
      padding: 13px 0;
      border-top: 5px solid var(--border);
      border-bottom: 5px solid var(--border);
    }

    #askep-test {
      min-height: 200px;
    }

    /* Footer */
    .site-footer {
      background: rgb(58, 58, 58);
      color: var(--white);
      padding: 28px 24px;
      text-align: center;
      font-family: Bitter, Georgia, serif;
      font-size: 11pt;
    }

    .site-footer a {
      color: var(--white);
      opacity: 0.85;
    }

    .site-footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    /* Mobile nav */
    @media (max-width: 767px) {
      .nav-toggle {
        display: block;
      }

      .main-nav {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        background: var(--primary);
        padding: 16px 0 28px;
      }

      .main-nav.open {
        display: block;
      }

      .main-nav ul {
        flex-direction: column;
        padding: 0 48px;
      }

      .main-nav a {
        border-bottom: none;
        border-left: 8px solid transparent;
        padding: 8px 0 8px 24px;
        font-size: 12pt;
      }

      .content {
        padding: 28px 16px 56px;
      }

      .content h1 {
        font-size: 24pt;
      }
    }

    @media (min-width: 768px) and (max-width: 1279px) {
      .content h1 {
        font-size: 29pt;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="https://www.dr-kravets-pereyaslav.clinic/головна">Сімейний лікар</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" onclick="toggleNav()">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="https://www.dr-kravets-pereyaslav.clinic/головна">Головна</a></li>
          <li><a href="https://www.dr-kravets-pereyaslav.clinic/контактна-інформація">Контактна інформація</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="content">
    <h1>Скринінг здоров'я 40+</h1>
    <div id="askep-test"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://www.dr-kravets-pereyaslav.clinic/головна">Головна</a>
      <a href="https://www.dr-kravets-pereyaslav.clinic/контактна-інформація">Контактна інформація</a>
    </div>
  </footer>

  <script
    defer
    src="https://askep.net/widgets/registry/registry.widget.js?public_key=c7a7eb868663ce3779901a37fc7b8f2b94200638559e5e39c85afb69b56fe056&container_id=askep-test&appointment_type=screening&isolate=1">
  </script>
  <script>
    function toggleNav() {
      var nav = document.getElementById('main-nav');
      var btn = document.querySelector('.nav-toggle');
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }
  </script>
</body>
</html>
